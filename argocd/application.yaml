apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Santi7870/grafana-kubernetes.git
    targetRevision: taller/argo-cd-gitops
    path: gitops-argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: grafana-deployment
      namespace: grafana-gitops
      jsonPointers:
        - /spec/replicas
