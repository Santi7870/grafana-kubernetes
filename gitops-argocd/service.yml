apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: grafana-gitops
  labels:
    app: grafana
    app.kubernetes.io/part-of: taller-argo-cd
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
      nodePort: 30544
